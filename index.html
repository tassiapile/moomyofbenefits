<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Discover People Near You</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
}

.card-container{
position:relative;
width:320px;
height:420px;
}

.card{
position:absolute;
width:100%;
height:100%;
background:#1e293b;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
display:flex;
flex-direction:column;
justify-content:flex-end;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}

.card-info{
position:relative;
background:linear-gradient(transparent, rgba(0,0,0,0.8));
padding:20px;
}

.name{
font-size:22px;
font-weight:bold;
}

.buttons{
margin-top:20px;
display:flex;
gap:20px;
}

button{
padding:14px 20px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
}

.like{
background:#22c55e;
color:white;
}

.skip{
background:#ef4444;
color:white;
}

.cta{
margin-top:30px;
background:#00BFFF;
padding:15px 30px;
border-radius:8px;
text-decoration:none;
color:white;
font-weight:bold;
}

.note{
font-size:12px;
opacity:0.6;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Discover People Near You</h2>

<div class="card-container" id="cardContainer"></div>

<div class="buttons">
<button class="skip" onclick="nextCard()">Skip</button>
<button class="like" onclick="nextCard()">Like</button>
</div>

<a class="cta" href="YOUR_AFFILIATE_LINK">See Real Matches</a>

<div class="note">
Profiles shown are illustrative previews.
</div>

<script>

const profiles = [

{
name:"Emma",
age:29,
city:"Nearby",
img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330"
},

{
name:"Sophia",
age:33,
city:"Nearby",
img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1"
},

{
name:"Olivia",
age:27,
city:"Nearby",
img:"https://images.unsplash.com/photo-1487412912498-0447578fcca8"
},

{
name:"Mia",
age:31,
city:"Nearby",
img:"https://images.unsplash.com/photo-1502767089025-6572583495b4"
}

]

let index = 0

function renderCard(){

if(index >= profiles.length){
index = 0
}

let p = profiles[index]

let container = document.getElementById("cardContainer")

container.innerHTML = `
<div class="card">
<img src="${p.img}">
<div class="card-info">
<div class="name">${p.name}, ${p.age}</div>
<div>${p.city}</div>
</div>
</div>
`

}

function nextCard(){
index++
renderCard()
}

renderCard()

</script>

</body>
</html>
