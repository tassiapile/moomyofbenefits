<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meet People Near You Tonight</title>
  <meta name="description" content="Discover people near your location and start chatting today." />

  <!-- PRECONNECT -->
  <link rel="preconnect" href="https://bggcegd.nzpixelsm.com">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.moomysofbenefits.online/">
  <meta property="og:title" content="Meet People Near You Tonight">
  <meta property="og:description" content="Discover people near your location and start chatting today.">
  <meta property="og:image" content="https://www.moomysofbenefits.online/fotos/image_1.jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:domain" content="moomysofbenefits.online">
  <meta name="twitter:url" content="https://www.moomysofbenefits.online/">
  <meta name="twitter:title" content="Meet People Near You Tonight">
  <meta name="twitter:description" content="Discover people near your location and start chatting today.">
  <meta name="twitter:image" content="https://www.moomysofbenefits.online/fotos/image_1.jpeg">

  <!-- ============================================================ -->
  <!-- ROTEAMENTO CONDICIONAL (CARD = OFERTA | BIO/LINK = LANDING) -->
  <!-- ============================================================ -->
  <script>
    (function () {
      var userAgent = (navigator.userAgent || "").toLowerCase();
      var isBot = /twitterbot|facebookexternalhit|whatsapp|telegrambot|bingbot|googlebot|slackbot/i.test(userAgent);

      // Só executa o redirecionamento automático se NÃO for o robô do Twitter gerando o card
      if (!isBot) {
        var urlParams = new URLSearchParams(window.location.search);
        var isCardClick = urlParams.has('src') || urlParams.has('direct') || urlParams.has('card');

        // Se o clique veio especificamente do link configurado para o Card
        if (isCardClick) {
          var LINK_A = "https://bggcegd.nzpixelsm.com/s/6b65e266c7411?preland=Casual";
          var LINK_B = "https://bggcegd.nzpixelsm.com/s/6b65e266c7411?preland=Casual";

          var count = 0;
          try {
            var saved = localStorage.getItem("cardDirectCount");
            count = saved ? parseInt(saved, 10) : 0;
            if (isNaN(count)) count = 0;
          } catch (e) {}

          count++;
          try {
            localStorage.setItem("cardDirectCount", count);
          } catch (e) {}

          // Alternância A/B (Ímpar = Link A, Par = Link B)
          var targetUrl = (count % 2 === 1) ? LINK_A : LINK_B;
          window.location.replace(targetUrl);
        }
      }
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPJQZFMK7X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-NPJQZFMK7X');
  </script>

  <style>
    [v-cloak] {
      display: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-color: #0f172a;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(15, 23, 42, 0.20),
        rgba(15, 23, 42, 0.35)
      );
      z-index: -1;
    }

    /* HERO */
    .hero {
      padding: 100px 20px 140px;
      flex: 1;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeHero 0.8s ease forwards;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }

    @keyframes fadeHero {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero h1 {
      font-size: 42px;
      line-height: 1.2;
      max-width: 900px;
      margin: auto;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.92;
      max-width: 700px;
      margin: 20px auto;
    }

    /* ONLINE */
    .online {
      margin-top: 25px;
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* SOCIAL PROOF */
    .social-proof {
      margin-top: 20px;
      font-size: 15px;
      color: #cbd5e1;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateY(6px);
    }

    /* CTA MOBILE */
    .mobile-cta {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 520px;
      background: #00BFFF;
      color: white;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: bold;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: block;
    }

    /* CTA DESKTOP */
    .desktop-cta {
      position: fixed;
      right: 30px;
      bottom: 30px;
      background: #00BFFF;
      color: white;
      padding: 18px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: block;
    }

    .cta-subtext {
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.92;
    }

    /* FOOTER */
    .footer {
      padding: 20px;
      font-size: 12px;
      color: #64748b;
    }

    .footer a {
      color: #64748b;
      text-decoration: none;
      margin: 0 10px;
    }

    /* PULSE */
    @keyframes pulseMobile {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
      100% { transform: translateX(-50%) scale(1); }
    }

    @keyframes pulseDesktop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .pulse-mobile {
      animation: pulseMobile 1.8s infinite;
    }

    .pulse-desktop {
      animation: pulseDesktop 1.8s infinite;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .desktop-cta {
        display: none !important;
      }
      .hero h1 {
        font-size: 34px;
      }
    }

    @media (min-width: 769px) {
      .mobile-cta {
        display: none !important;
      }
    }
  </style>

  <!-- Carregamento síncrono estável do Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>

<body>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/tassiapile/moomyofbenefits/main/fotos/video_1.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
  
  <div id="app" v-cloak>
    <section class="hero">
      <h1>
        {{ t.headline.replace('{greet}', greet).replace('{city}', city) }}
      </h1>

      <p>
        {{ t.subtext.replace('{city}', city) }}
      </p>

      <div class="online">
        <span>{{ onlineCount }}</span>
        {{ t.onlineText }}
      </div>

      <div class="social-proof" id="socialProof">
        🔥 {{ proofText }}
      </div>
    </section>

    <!-- CTA MOBILE -->
    <a id="ctaMobile" href="javascript:void(0)" class="mobile-cta pulse-mobile" rel="nofollow noopener" @click.prevent="handleCTA">
      <div>
        {{ t.cta }}
      </div>
      <div class="cta-subtext">
        {{ t.trust }}
      </div>
    </a>

    <!-- CTA DESKTOP -->
    <a id="ctaDesktop" href="javascript:void(0)" class="desktop-cta pulse-desktop" rel="nofollow noopener" @click.prevent="handleCTA">
      {{ t.cta }}
    </a>

    <footer class="footer">
      <a href="#">Privacy Policy</a>
      |
      <a href="#">Terms of Service</a>
      |
      <span>18+ Only</span>
    </footer>
  </div>

  <script>
    (function initApplication() {
      if (typeof Vue === "undefined") return;

      const { createApp, ref, computed, onMounted } = Vue;

      // =========================
      // LINKS DE OFERTA
      // =========================
      const LINK_A = "https://bggcegd.nzpixelsm.com/s/6b65e266c7411?preland=Casual";
      const LINK_B = "https://bggcegd.nzpixelsm.com/s/6b65e266c7411?preland=Casual";

      // =========================
      // TRADUÇÕES
      // =========================
      const translations = {
        en: {
          fallbackCity: "your area",
          greetings: {
            morning: "Good morning",
            afternoon: "Good afternoon",
            evening: "Good evening"
          },
          headline: "{greet}! People in {city} are looking to meet tonight",
          subtext: "New profiles from {city} joined in the last few minutes",
          onlineText: "people online right now",
          cta: "See Matches Near You",
          trust: "✔ Free sign-up • ✔ Private • ✔ Instant access",
          proof: "new people joined near you"
        },
        pt: {
          fallbackCity: "sua região",
          greetings: {
            morning: "Bom dia",
            afternoon: "Boa tarde",
            evening: "Boa noite"
          },
          headline: "{greet}! Pessoas em {city} estão querendo um encontro hoje à noite",
          subtext: "Novos perfis de {city} entraram nos últimos minutos",
          onlineText: "pessoas online agora",
          cta: "Ver Pessoas Perto de Você",
          trust: "✔ Cadastro grátis • ✔ Privado • ✔ Acesso imediato",
          proof: "novas pessoas entraram perto de você"
        }
      };

      const app = createApp({
        setup() {
          const lang = ref("en");
          const city = ref("");
          const timeOfDay = ref("evening");
          const onlineCount = ref(0);
          const proofText = ref("");

          const t = computed(() => {
            return translations[lang.value] || translations.en;
          });

          const greet = computed(() => {
            return t.value.greetings[timeOfDay.value] || t.value.greetings.evening;
          });

          const initLang = () => {
            try {
              const navLang = (navigator.language || navigator.userLanguage || "en").slice(0, 2).toLowerCase();
              if (translations[navLang]) {
                lang.value = navLang;
                document.documentElement.lang = navLang;
              }
            } catch (e) {
              lang.value = "en";
            }
          };

          const initGeo = async () => {
            city.value = t.value.fallbackCity;
            try {
              const res = await fetch('https://ipapi.co/json/');
              if (!res.ok) return;
              const data = await res.json();
              if (data && data.city) {
                city.value = data.city;
              } else if (data && data.region) {
                city.value = data.region;
              }
            } catch (e) {}
          };

          const initTime = () => {
            const hour = new Date().getHours();
            if (hour < 12) {
              timeOfDay.value = "morning";
            } else if (hour < 18) {
              timeOfDay.value = "afternoon";
            } else {
              timeOfDay.value = "evening";
            }
          };

          const initOnlineCount = () => {
            const min = 120;
            const max = 350;
            onlineCount.value = Math.floor(Math.random() * (max - min) + min);
          };

          const updateProof = () => {
            const n = Math.floor(Math.random() * 18) + 8;
            proofText.value = `${n} ${t.value.proof}`;

            const el = document.getElementById("socialProof");
            if (!el) return;

            el.style.opacity = "1";
            el.style.transform = "translateY(0)";

            setTimeout(() => {
              el.style.opacity = "0.75";
            }, 2500);
          };

          const getClickCount = () => {
            try {
              const countStr = localStorage.getItem("ctaClickCount");
              if (!countStr) return 0;
              const count = parseInt(countStr, 10);
              return isNaN(count) ? 0 : count;
            } catch (e) {
              return 0;
            }
          };

          const saveClickCount = (count) => {
            try {
              localStorage.setItem("ctaClickCount", count);
            } catch (e) {}
          };

          const getNextLink = () => {
            let count = getClickCount();
            count++;
            saveClickCount(count);

            if (count % 2 === 1) {
              return { url: LINK_A, type: "A", count };
            }
            return { url: LINK_B, type: "B", count };
          };

          const handleCTA = () => {
            const result = getNextLink();

            if (typeof gtag === "function") {
              gtag('event', 'cta_click', {
                event_category: 'engagement',
                event_label: result.type,
                value: result.count
              });
            }

            setTimeout(() => {
              window.location.href = result.url;
            }, 100);
          };

          onMounted(() => {
            initLang();
            initGeo();
            initTime();
            initOnlineCount();
            updateProof();

            setInterval(updateProof, 5000);
          });

          return {
            city,
            t,
            greet,
            onlineCount,
            proofText,
            handleCTA
          };
        }
      });

      app.mount('#app');
    })();
  </script>
</body>
</html>
